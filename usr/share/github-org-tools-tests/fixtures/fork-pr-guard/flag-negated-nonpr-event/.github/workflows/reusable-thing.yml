## Gated on a NEGATION of a non-PR event. 'github.event_name !=
## 'schedule'' is true on a pull_request, so this STILL runs on fork
## PRs and checks out their ref -- a bare event negation does not keep
## fork PRs out. Must flag (fail-closed). Expect W-009.
name: fixture
on:
  workflow_call:
permissions:
  contents: read
jobs:
  work:
    if: >-
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
      && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
