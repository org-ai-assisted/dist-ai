## Gated on a bare 'github.event_name != 'pull_request'' with no
## head-repo guard. This excludes the pull_request event, but on a
## pull_request_target it is TRUE (event_name is 'pull_request_target'),
## so it does not defend that path. The sanctioned defense is the
## head-repo guard literal; a bare event negation is not accepted.
## Expect W-009.
name: fixture
on:
  workflow_call:
permissions:
  contents: read
jobs:
  work:
    if: >-
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
      && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
