## Reusable whose job runs only on schedule / workflow_dispatch -- it
## never sees a pull_request, so a PR-controllable ref cannot arrive.
## The clusterfuzzlite scheduled-job shape. Expect no W-009.
name: fixture
on:
  workflow_call:
permissions:
  contents: read
jobs:
  work:
    if: >-
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
