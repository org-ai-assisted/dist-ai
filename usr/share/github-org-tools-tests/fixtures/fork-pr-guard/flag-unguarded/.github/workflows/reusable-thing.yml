## Reusable that checks out a PR-controllable ref with only the
## CI-enabled gate -- no fork-PR guard. The reusable-coverity.yml shape
## this rule exists to catch. Expect W-009.
name: fixture
on:
  workflow_call:
permissions:
  contents: read
jobs:
  work:
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
