name: fixture
on:
  push:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  work:
    if: ${{ vars.CI_ENABLED_ORG_AI_ASSISTED == 'true' && (github.event_name == 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: printf 'x\n'
