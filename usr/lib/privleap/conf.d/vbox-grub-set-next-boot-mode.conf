## AI-Assisted

## Host-side one-shot GRUB boot-mode selection for the image-test harness: set grubenv
## next_entry on the CALLER'S OWN installed VM disk (VM powered off) so the installed
## system boots a chosen mode DETERMINISTICALLY -- no OCR of the "Choose boot mode" menu.
## A dm-release-test runner is DELIBERATELY sudo-less (vboxusers only, never sysmaint) so
## a guest escape cannot reach host root; it therefore cannot run `sudo image-mount`.
## This action is the narrow escalation: it runs the arg-scoped 'vbox-grub-set-next-boot-mode'
## wrapper as root, which touches ONLY the caller's OWN disk and sets ONLY next_entry to an
## EXISTING gnulinux-<mode>-<dev> menuentry id (see the wrapper's NARROW contract). No
## arbitrary root write, so it is safe to authorize the whole vboxusers group (the image-test
## accounts, whose names are generated per run).
## Comm-socket permission is SEPARATE from action authorization: without this the vboxusers
## image-test runner cannot even open a privleap comm socket to REQUEST the action. privleap
## unions [allowed-users] across conf.d (duplicate groups are skipped, not an error), so this
## sits safely alongside the sibling vbox-disk-extract-mok.conf. The socket is created on
## demand by the harness (leapctl --create <uid>), since a runner account never logs in.
[allowed-users]
Group=vboxusers

[action:vbox-grub-set-next-boot-mode]
Command=/usr/libexec/image-test/vbox-grub-set-next-boot-mode
AuthorizedGroups=vboxusers
