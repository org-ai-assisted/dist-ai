## AI-Assisted

## Host-side MOK cert read for the image-test harness (dm-calamares-install
## --mok-enroll). A dm-release-test runner is DELIBERATELY sudo-less (vboxusers
## only, never sysmaint) so a guest escape cannot reach host root; it therefore
## cannot run `sudo vbox-disk-extract` for the post-install MOK enroll. This
## action is the narrow escalation: it runs the arg-scoped 'vbox-mok-extract'
## wrapper as root, which reads ONLY the caller's OWN VM disk and ONLY the PUBLIC
## /var/lib/dkms/mok.pub (see the wrapper's NARROW contract). No arbitrary root
## read, so it is safe to authorize the whole vboxusers group (the image-test
## accounts, whose names are generated per run).
## Comm-socket permission is SEPARATE from action authorization: without this
## the vboxusers image-test runner cannot even open a privleap comm socket to
## REQUEST the action ("not permitted to have a comm socket"). The socket itself
## is created on demand by the harness (leapctl --create <uid>), since a runner
## account never logs in so leapctl@<uid>.service never fires.
[allowed-users]
Group=vboxusers

[action:vbox-disk-extract-mok]
Command=/usr/libexec/image-test/vbox-mok-extract
AuthorizedGroups=vboxusers
