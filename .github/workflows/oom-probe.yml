## TEMPORARY probe: make CI failure diagnostics actually fire.
##
## The derivative-maker build lane dies in a way that leaves NO evidence: the
## build step never concludes, and every step after it -- an 'if: failure()'
## collector and github's own post-steps included -- is recorded as never having
## run. This reproduces the two kill shapes in ~1 minute instead of ~40, so the
## collector can be fixed by experiment rather than by guesswork.
##
##   process-oom  a memory-limited CHILD is killed; the step fails, runner lives
##   runner-oom   allocation continues until the runner agent itself dies
##
## Delete once the collector is proven.
name: OOM probe

on:
  workflow_dispatch:
    inputs:
      shape:
        description: 'process-oom or runner-oom'
        required: true
        default: 'process-oom'

permissions:
  contents: read
  actions: read

jobs:
  victim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Sample memory in-step, then trigger the kill
        run: |
          ( while true; do
              printf '%s\n' "MEMSAMPLE $(date --utc +%H:%M:%SZ) MemAvailable=$(grep '^MemAvailable:' /proc/meminfo | tr -dc '0-9')kB"
              sleep 2
            done ) &
          sampler_pid="$!"
          trap 'kill "${sampler_pid}" 2>/dev/null || true' EXIT
          case "${{ inputs.shape }}" in
            process-oom)
              printf '%s\n' "starting a memory-limited child (runner should survive)"
              sudo systemd-run --scope --property=MemoryMax=128M --quiet \
                bash -c 'a=(); while :; do a+=("$(head -c 1048576 /dev/zero | tr "\0" "x")"); done'
              ;;
            runner-oom)
              printf '%s\n' "allocating without limit (runner expected to die)"
              bash -c 'a=(); while :; do a+=("$(head -c 10485760 /dev/zero | tr "\0" "x")"); done'
              ;;
            *)
              printf '%s\n' "unknown shape" >&2
              exit 2
              ;;
          esac

      - name: Step-level collector
        if: failure()
        run: |
          printf '%s\n' "===== STEP-LEVEL COLLECTOR RAN ====="
          oom="$(sudo dmesg 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -5 || true)"
          if [ -n "${oom}" ]; then printf '%s\n' "${oom}"; else printf '%s\n' "no kernel OOM records"; fi
          free --human || true

  postmortem:
    needs: victim
    if: always() && needs.victim.result != 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Report what the API knows about the dead job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "===== POSTMORTEM JOB RAN (fresh runner) ====="
          printf '%s\n' "victim result: ${{ needs.victim.result }}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | "\(.name): \(.conclusion) | " + ([.steps[] | "\(.number)=\(.conclusion // "none")"] | join(","))' \
            || printf '%s\n' "api query failed"
