## AI-Assisted

## dist-ai SELF-test lane for the bare-runner userns lane's file discovery.
##
## ci/dist-ai-userns-lane.sh decides which test files the userns lane runs; a
## regression in discover_userns_test_files either silently no-ops a real userns
## test (a false green) or omits a broken one that should fail loud. The suite
## drives the REAL discover_userns_test_files against fixtures (pytest, no root, no
## userns, no network), so it runs in seconds. These tools live HERE and have no
## downstream consumer workflow to exercise them, so without this lane a regression
## would surface nowhere. local-* prefix per G-A-005: dist-ai-specific, not a
## cross-repo reusable, and NOT a pkg_update_consumer_workflows-managed
## consumer-*.yml template.

name: userns-lane-self-tests

on:
  push:
    branches:
      - master
      - ai
    paths:
      - 'ci/dist-ai-userns-lane.sh'
      - 'usr/bin/dist-ai-userns-lane-tests'
      - 'usr/share/dist-ai-userns-lane-tests/**'
      - '.github/workflows/local-userns-lane-tests.yml'
  pull_request:
    paths:
      - 'ci/dist-ai-userns-lane.sh'
      - 'usr/bin/dist-ai-userns-lane-tests'
      - 'usr/share/dist-ai-userns-lane-tests/**'
      - '.github/workflows/local-userns-lane-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  userns-lane-self-tests:
    ## CI runs only where we enabled it. Unset variable -> the job is skipped, no
    ## runner is allocated, and the run stays green: forks are never handed a red X
    ## for a lane they did not opt into.
    if: vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install apt deps
        uses: org-ai-assisted/developer-meta-files/.github/actions/install-deps@master
        with:
          ## The suite drives the REAL discovery, which runs pytest per file;
          ## safe-rm cleans the fixture dir. No install-self: it runs dist-ai's own
          ## tree in place from the checkout, nothing is written to /usr.
          apt-packages: 'python3-pytest safe-rm'

      - name: Run userns-lane self-tests (pytest; no root, no userns, no network)
        run: ./usr/bin/dist-ai-userns-lane-tests
